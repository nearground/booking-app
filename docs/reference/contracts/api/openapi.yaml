  "components": {
    "securitySchemes": {
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "_token",
        "description": "Current middleware accepts only this cookie, not Authorization: Bearer. Login also returns a sensitive JWT in JSON. Do not send passwords or JWTs to an LLM."
      }
    },
    "schemas": {
      "Envelope": {
        "type": "object",
        "properties": {
          "errors": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "data": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "errors",
          "data"
        ],
        "description": "Common sendError/validation envelope; legacy handlers may vary."
      },
      "OpenObject": {
        "type": "object",
        "additionalProperties": true
      },
      "UserRegistrationRequest": {
        "type": "object",
        "required": [
          "firstName",
          "lastName",
          "email",
          "username",
          "password",
          "phoneNumber",
          "country"
        ],
        "properties": {
          "firstName": {
            "type": "string"
          },
          "lastName": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 30,
            "pattern": "^[a-zA-Z0-9._-]+$"
          },
          "password": {
            "type": "string",
            "format": "password",
            "writeOnly": true,
            "description": "At least 8 characters including upper/lowercase, digit, and one of $@#&!."
          },
          "phoneNumber": {
            "type": "string",
