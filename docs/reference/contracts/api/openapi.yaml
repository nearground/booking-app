{
  "openapi": "3.0.3",
  "info": {
    "title": "Booking API (MCP research subset)",
    "version": "0.1.0",
    "description": "Verified current routes for authentication, organization onboarding/invites, experiences and management, cart/checkout, and customer order confirmation. This is a research snapshot, not a promise of future contracts. Unknown/partial schemas and authentication gaps are documented in inventory.md. Unsafe requests authenticated by _token cookie require matching _csrf_token cookie and x-csrf-token (or x-xsrf-token) header. Rate limits and cookie semantics vary by operation; see inventory.md."
  },
  "servers": [
    {
      "url": "http://localhost:4000",
      "description": "Development API (optional read-only smoke target)"
    }
  ],
  "paths": {
    "/api/users/register": {
      "put": {
        "operationId": "registerUser",
        "summary": "Register a user",
        "tags": [
          "Authentication"
        ],
        "description": "Public. Email is trimmed, lowercased and unique across users. Starts email verification, but does not create a login session. Verified email ownership claims only eligible guest orders whose saveBookingForLater preference is not false.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UserRegistrationRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "$ref": "#/components/responses/CreatedEnvelope"
          },
          "default": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/api/users/login": {
      "post": {
        "operationId": "loginUser",
        "summary": "Log in",
        "tags": [
          "Authentication"
        ],
        "description": "Public. Returns token in JSON and sets _token (HttpOnly) plus CSRF cookies; do not expose returned token to an agent model.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "$ref": "#/components/responses/LoginSuccess"
          },
          "default": {
            "$ref": "#/components/responses/ErrorEnvelope"
          }
        }
      }
    },
    "/api/users/email-verification/request": {
      "post": {
        "operationId": "requestEmailVerification",
        "summary": "Request email ownership verification",
        "description": "Public, forgot-password rate limiter. Returns an anti-enumeration message; does not return the verification token.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EmailRequest" } } } },
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
    "/api/users/email-verification/confirm": {
      "post": {
        "operationId": "confirmEmailVerification",
        "summary": "Verify email and claim eligible guest orders",
        "description": "Public capability exchange. Body token proves email ownership; equality of email alone is insufficient. Returns data.emailVerified and data.claimedOrderCount. Explicit saveBookingForLater=false orders are excluded. Invalid, expired or reused tokens return 400.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["token"], "properties": { "token": { "type": "string" } } } } } },
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
    "/api/users/forgot-password": {
      "post": {
        "operationId": "forgotPassword",
        "summary": "Request a password reset email",
        "description": "Public, forgot-password rate limiter. Returns generic success for existing and unknown emails; missing email returns 400. Link uses configured FRONTEND_BASE_URL (localhost:8080 in development).",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EmailRequest" } } } },
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
    "/api/users/reset-password/{token}": {
      "get": {
        "operationId": "validateResetToken",
        "summary": "Validate a password reset capability",
        "description": "Public. Returns data.valid; does not change the password.",
        "parameters": [{ "name": "token", "in": "path", "required": true, "schema": { "type": "string" } }],
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
    "/api/users/reset-password": {
      "post": {
        "operationId": "resetPassword",
        "summary": "Consume a password reset token",
        "description": "Public, single-use token. Email is optional; when supplied it must match the token account after normalization. Unknown, expired and reused tokens are rejected.",
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["token", "newPassword"], "properties": {
          "token": { "type": "string" }, "newPassword": { "type": "string", "minLength": 6 }, "email": { "type": "string", "format": "email" }
        } } } } },
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
    "/api/organization-sites/{slug}": {
      "get": {
        "operationId": "getPublicOrganizationSite",
        "summary": "Read public organization branding and upcoming experiences",
        "description": "Public safe-field allow-list; includes branding, contact/social links intentionally published by admins, and experiences with scheduled upcoming sessions. Empty branded sites are valid. Unknown/reserved slugs return 404. Experience links are relative /experience/{id}.",
        "parameters": [{ "name": "slug", "in": "path", "required": true, "schema": { "type": "string" } }],
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
    "/api/organization-sites/admin/{organizationId}/branding": {
      "parameters": [{ "name": "organizationId", "in": "path", "required": true, "schema": { "type": "integer" } }],
      "get": {
        "operationId": "getOrganizationBranding",
        "summary": "Read organization branding as an admin",
        "security": [{ "cookieAuth": [] }],
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      },
      "patch": {
        "operationId": "updateOrganizationBranding",
        "summary": "Update validated organization branding",
        "description": "Organization admin only, with CSRF. Unknown fields rejected. Media keys must be uploaded by the current admin. Unique slug conflicts return 409. See inventory for field validation.",
        "security": [{ "cookieAuth": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "type": "object", "description": "Partial branding fields; see inventory. Nested validation remains authoritative on the server.", "additionalProperties": true } } } },
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
    "/api/orders/guest-receipt": {
      "post": {
        "operationId": "getGuestOrder",
        "summary": "Read an unclaimed guest receipt using its private capability",
        "description": "No customer session required. Requires orderNumber plus receiptToken in JSON, not in the URL. Invalid, expired, claimed and missing receipts return 404. Stored capability hashes/metadata are not returned; confirmationEmail and saveBookingForLater are exposed separately.",
        "security": [],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/GuestReceiptRequest" } } } },
        "responses": { "200": { "$ref": "#/components/responses/SuccessEnvelope" }, "default": { "$ref": "#/components/responses/ErrorEnvelope" } }
      }
    },
