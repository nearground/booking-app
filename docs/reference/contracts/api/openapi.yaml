{
  "openapi": "3.0.3",
  "info": {
    "title": "Booking API (MCP research subset)",
    "version": "0.2.0",
    "description": "Verified current routes for authentication, organization onboarding/invites, experiences and management, cart/checkout, and customer order confirmation. This is a research snapshot, not a promise of future contracts. Unknown/partial schemas and authentication gaps are documented in inventory.md. Unsafe requests authenticated by _token cookie require matching _csrf_token cookie and x-csrf-token (or x-xsrf-token) header. Rate limits and cookie semantics vary by operation; see inventory.md."
  },
  "servers": [
    {
      "url": "http://localhost:4000",
      "description": "Development API (optional read-only smoke target)"
    }
  ],
  "paths": {
    "/api/users/email-verification/request": {
      "post": {
        "operationId": "requestEmailVerification",
        "summary": "Request a user-mediated email verification link",
        "description": "Public; shared forgot-password limiter, default 8/hour/IP. Always returns a generic success message for missing or already-verified accounts; does not prove email delivery.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": { "email": { "type": "string", "format": "email" } }
              }
            }
          }
        },
        "responses": {
          "200": { "$ref": "#/components/responses/SuccessEnvelope" },
          "default": { "$ref": "#/components/responses/ErrorEnvelope" }
        }
      }
    },
    "/api/users/email-verification/confirm": {
      "post": {
        "operationId": "confirmEmailVerification",
        "summary": "Verify account email and transfer matching guest orders",
        "description": "Public, user-mediated proof. Consumes a single-use 24-hour verification token, verifies email and claims unowned orders matching normalized mainContactEmail. Does not create a login session. No explicit route limiter. Keep tokens out of model context and chat.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["token"],
                "properties": {
                  "token": { "type": "string", "minLength": 32, "maxLength": 256, "writeOnly": true }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Email verified; data contains emailVerified=true and claimedOrderCount.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Envelope" }
              }
            }
          },
          "400": { "description": "Verification link is invalid, used or expired." },
          "default": { "$ref": "#/components/responses/ErrorEnvelope" }
        }
      }
    },
    "/api/orders/guest-receipt": {
      "post": {
        "operationId": "getGuestOrder",
        "summary": "Read an unclaimed guest receipt using its private capability",
        "description": "No account or cart cookie required. Requires orderNumber plus receiptToken, not a reservation confirmation code. Checks a hashed token and 30-day expiry, and CustomerId must be null. No explicit route limiter. Global CSRF applies if _token is present. Never expose the capability to a model or public chat.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": ["orderNumber", "receiptToken"],
                "properties": {
                  "orderNumber": { "type": "string" },
                  "receiptToken": { "type": "string", "minLength": 1, "writeOnly": true }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "data.order includes items and confirmationEmail; order metadata is set to null.",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/Envelope" }
              }
            }
          },
          "400": { "description": "orderNumber and receiptToken are required." },
          "404": { "description": "Receipt not found (unknown, claimed, invalid or expired capability)." },
          "default": { "$ref": "#/components/responses/ErrorEnvelope" }
        }
      }
    },
