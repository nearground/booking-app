  "components": {
    "securitySchemes": {
      "cartSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "_cart_session",
        "description": "Private anonymous cart session established by adding an item, not by GET cart."
      },
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "_token",
        "description": "Current middleware accepts only this cookie, not Authorization: Bearer. Login also returns a sensitive JWT in JSON. Do not send passwords or JWTs to an LLM."
      }
    },
    "schemas": {
      "ExperienceSchedule": {
        "type": "object",
        "required": ["elements", "paging", "metadata"],
        "properties": {
          "elements": { "type": "array", "items": { "$ref": "#/components/schemas/OpenObject" } },
          "paging": {
            "type": "object",
            "required": ["currentPage", "totalPages", "pageSize"],
            "properties": {
              "currentPage": { "type": "integer" },
              "totalPages": { "type": "integer" },
              "pageSize": { "type": "integer" }
            }
          },
          "metadata": {
            "type": "object",
            "required": ["totalResults", "timezone"],
            "properties": {
              "totalResults": { "type": "integer" },
              "timezone": { "type": "string" }
            }
          }
        }
      },
      "ExperienceCalendar": {
        "type": "object",
        "required": ["elements", "metadata"],
        "properties": {
          "elements": {
            "type": "array",
            "items": {
              "type": "object",
              "required": ["date", "status"],
              "properties": {
                "date": { "type": "string", "format": "date" },
                "status": { "type": "string", "enum": ["open", "full"] }
              }
            }
          },
          "metadata": {
            "type": "object",
            "required": ["month", "timezone", "totalDays"],
            "properties": {
              "month": { "type": "string" },
              "timezone": { "type": "string" },
              "totalDays": { "type": "integer" }
            }
          }
        }
      },
      "Envelope": {
        "type": "object",
        "properties": {
          "errors": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "data": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "errors",
          "data"
        ],
        "description": "Common sendError/validation envelope; legacy handlers may vary."
      },
      "OpenObject": {
        "type": "object",
        "additionalProperties": true
      },
      "UserRegistrationRequest": {
        "type": "object",
        "required": [
          "firstName",
          "lastName",
          "email",
          "username",
          "password",
          "phoneNumber",
          "country"
        ],
        "properties": {
          "firstName": {
            "type": "string"
          },
          "lastName": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 30,
            "pattern": "^[a-zA-Z0-9._-]+$"
          },
          "password": {
            "type": "string",
            "format": "password",
            "writeOnly": true,
            "description": "At least 8 characters including upper/lowercase, digit, and one of $@#&!."
          },
          "phoneNumber": {
            "type": "string",
            "description": "US-style 10-digit number, optional hyphens/spaces/parentheses."
          },
          "country": {
            "type": "string"
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string",
            "format": "password",
            "writeOnly": true
          },
          "organizationUsername": {
            "type": "string"
          }
        }
      },
      "OnboardingStartRequest": {
        "type": "object",
        "required": [
          "mode",
          "email"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "create",
              "invite"
            ]
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "inviteToken": {
            "type": "string"
          },
          "inviteCode": {
            "type": "string"
          }
        }
      },
      "OnboardingCompleteRequest": {
        "type": "object",
        "required": [
          "mode",
          "firstName",
          "lastName",
          "email",
          "username",
          "password",
          "phoneNumber",
          "country"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "create",
              "invite"
            ]
          },
          "firstName": {
            "type": "string"
          },
          "lastName": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
