services:
  frontend:
    build:
      dockerfile: Dockerfile
    volumes: !reset []
    ports: !override
      - "127.0.0.1:8080:80"
    environment:
      API_BASE_URL: http://backend:4000
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: !override
      backend:
        condition: service_healthy
  backend:
    build:
      dockerfile: Dockerfile
    volumes: !reset []
    environment:
      NODE_ENV: production
      FRONTEND_BASE_URL: https://puertovallarta.today
      MEDIA_PUBLIC_BASE_URL: /api/media/object
      CORS_ALLOWED_ORIGINS: https://puertovallarta.today
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      COOKIE_DOMAIN: ""
      DB_SYNC_ON_STARTUP: "false"
      DB_SYNC_FORCE: "false"
      SCHEDULER_SYNC_ENABLED: "false"
  internal-docs:
    profiles: ["disabled-in-tunnel"]
